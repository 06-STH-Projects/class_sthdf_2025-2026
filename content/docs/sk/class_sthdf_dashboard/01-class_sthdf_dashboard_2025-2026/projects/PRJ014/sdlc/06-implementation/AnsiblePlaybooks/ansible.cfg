# /ansible.cfg
[defaults]
vars_plugins_enabled = host_group_vars, host_inventory_vars, community.general.yaml
inventory = ./inventory/hosts.ini
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
timeout = 30
stdout_callback = yaml
forks = 10  
gathering = smart 

[ssh_connection]
pipelining = True