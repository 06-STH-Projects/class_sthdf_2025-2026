---
# roles/lxc_general/tasks/firewall.yml
- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

- name: Default deny all incoming, allow outgoing
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  become: true

- name: Allow essential ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  loop: "{{ lxc_general_ufw_allowed_ports | default([22]) }}"
  become: true

- name: Gather package facts to check for Nginx
  ansible.builtin.package_facts:
    manager: auto

- name: Enable rate limiting on HTTP port if Nginx is installed
  community.general.ufw:
    rule: limit
    port: '80'
    proto: tcp
  when:
    - "'80' in (lxc_general_ufw_allowed_ports | default([]) | map('string') | list)"
    - "'nginx' in ansible_facts.packages or 'nginx-core' in ansible_facts.packages or 'nginx-full' in ansible_facts.packages"
  become: true

- name: Enable rate limiting on HTTPS port if Nginx is installed
  community.general.ufw:
    rule: limit
    port: '443'
    proto: tcp
  when:
    - "'443' in (lxc_general_ufw_allowed_ports | default([]) | map('string') | list)"
    - "'nginx' in ansible_facts.packages or 'nginx-core' in ansible_facts.packages or 'nginx-full' in ansible_facts.packages"
  become: true

- name: Enable UFW logging
  community.general.ufw:
    logging: 'on'
  become: true
