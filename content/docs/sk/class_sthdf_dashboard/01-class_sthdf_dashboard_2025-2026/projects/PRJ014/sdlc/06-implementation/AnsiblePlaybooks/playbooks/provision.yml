---
- name: Provision LXC containers
  hosts: proxmox
  gather_facts: false
  roles:
    - proxmox_api

- name: Bootstrap new LXCs
  hosts: new_lxcs
  gather_facts: true
  become: true
  serial: 1
  roles:
    - lxc_general
  tasks:
    - name: Apply service roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ extra_roles | default([]) }}"
